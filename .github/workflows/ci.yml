name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same branch cancels its still-running CI (per event
# type, so a PR run never cancels the branch's push run). main is never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        # Windows covers the integrated terminal's ConPTY path (node-pty).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false
          
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit --audit-level=high

      - name: Check node-pty glibc floor (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-pty-glibc.sh

      - name: Integrated terminal smoke test (node-pty)
        run: node scripts/pty-smoke.js

      - name: Typecheck
        run: pnpm run typecheck
        
      - name: Run Tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
